# Construction de CUT THE FLOW sur les trois systèmes, et PUBLICATION des
# fichiers téléchargeables.
#
# Ce fichier vit à la racine du dépôt (`.github/workflows/build.yml`) : GitHub
# n'exécute que les workflows présents à cet endroit. Les chemins supposent que
# `astro/` et `rust/` sont à la racine.
#
# ── Pourquoi une version « glissante » ────────────────────────────────
# Chaque poussée sur `main` reconstruit les cinq binaires et met à jour une
# release dont le tag est `latest`. Les liens de téléchargement du README sont
# donc stables et toujours valables :
#
#   https://github.com/zigmoon/cuttheflow/releases/latest/download/<fichier>
#
# Un tag `cuttheflow-v*` crée en plus une release versionnée, marquée comme
# « latest » elle aussi : les mêmes liens continuent de fonctionner.
#
# ── Signature macOS : deux niveaux, jamais bloquants ──────────────────
#   1. TOUJOURS : signature ad-hoc (`codesign -s -`). Indispensable : sur Apple
#      Silicon, un binaire non signé est tué par le noyau.
#   2. SI les secrets sont fournis : signature Developer ID (durcie) +
#      notarisation Apple + agrafage. Secrets attendus :
#        MACOS_CERT_P12          certificat .p12 encodé en base64
#        MACOS_CERT_PASSWORD     mot de passe du .p12
#        MACOS_SIGN_IDENTITY     ex. « Developer ID Application: NOM (TEAMID) »
#        MACOS_NOTARY_APPLE_ID   identifiant Apple
#        MACOS_NOTARY_PASSWORD   mot de passe d'application (app-specific)
#        MACOS_NOTARY_TEAM_ID    identifiant d'équipe
#      (variante clé API : MACOS_NOTARY_KEY_ID / MACOS_NOTARY_ISSUER_ID /
#       MACOS_NOTARY_KEY_P8, contenu du .p8 en base64.)
#      Sans ces secrets le workflow réussit : les binaires sont ad-hoc signés,
#      donc exécutables, simplement non notariés.

name: CUT THE FLOW

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'cuttheflow-v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Deux poussées rapprochées ne doivent pas se disputer la même release.
concurrency:
  group: cuttheflow-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests du moteur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace --manifest-path rust/Cargo.toml

  build:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x86-64
            binary: cuttheflow-windows-x86_64.exe
            bin: cuttheflow.exe
            package: windows-x86_64
            launcher: DEMARRER.cmd
            compress: powershell
            # Fenêtre native : l'interface s'ouvre dans une vraie fenêtre
            # d'application (WebView2, présent sur Windows 10/11).
            features: '--features desktop'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: Linux x86-64 (autonome)
            binary: cuttheflow-linux-x86_64
            bin: cuttheflow
            package: linux-x86_64
            launcher: demarrer.sh
            compress: zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: Linux x86-64 (fenêtre native)
            binary: cuttheflow-linux-x86_64-desktop
            bin: cuttheflow
            package: linux-x86_64-desktop
            launcher: demarrer.sh
            compress: zip
            # La fenêtre native exige WebKitGTK (donc glibc, pas musl).
            features: '--features desktop'
            webkit: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: Linux ARM64
            binary: cuttheflow-linux-aarch64
            bin: cuttheflow
            package: linux-aarch64
            launcher: demarrer.sh
            compress: zip
            cross: aarch64-linux-gnu-gcc
          - os: macos-15
            target: aarch64-apple-darwin
            name: macOS Apple Silicon
            binary: cuttheflow-macos-arm64
            bin: cuttheflow
            package: macos-arm64
            launcher: demarrer.command
            compress: zip
            # WKWebView fait partie de macOS : la fenêtre native ne demande
            # aucune bibliothèque supplémentaire.
            features: '--features desktop'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macOS Intel
            binary: cuttheflow-macos-x86_64
            bin: cuttheflow
            package: macos-x86_64
            launcher: demarrer.command
            compress: zip
            features: '--features desktop'

    runs-on: ${{ matrix.os }}
    env:
      # Les secrets sont exposés au niveau du job : un `if` d'étape ne peut pas
      # lire un `env` défini sur cette même étape.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Interface Astro
        run: |
          npm ci --prefix astro
          npm run build --prefix astro

      - name: Dépendances Linux (musl x86-64)
        if: runner.os == 'Linux' && matrix.cross == '' && !matrix.webkit
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Dépendances Linux (musl ARM64)
        if: runner.os == 'Linux' && matrix.cross != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      # WebKitGTK est la seule dépendance de compilation de la fenêtre native
      # sous Linux. Elle est fournie par la distribution à l'exécution.
      - name: Dépendances Linux (WebKitGTK, fenêtre native)
        if: matrix.webkit
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Moteur Rust (natif)
        if: matrix.cross == ''
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} -p ctf-app ${{ matrix.features }}

      - name: Moteur Rust (ARM64 croisé)
        if: matrix.cross != ''
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.cross }}
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} -p ctf-app ${{ matrix.features }}

      - name: Tests unitaires du noyau
        if: matrix.cross == '' && runner.os != 'Linux'
        run: cargo test --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} -p ctf-core

      # ── macOS : signature ──────────────────────────────────────────────
      - name: macOS — signature ad-hoc (toujours)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$BIN"
          codesign --force --sign - --timestamp=none "$BIN"
          codesign --verify --verbose=2 "$BIN"

      - name: macOS — signature Developer ID (si secret présent)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          KEYCHAIN="$RUNNER_TEMP/ctf-signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          codesign --force --options runtime --timestamp \
            --entitlements rust/scripts/macos-entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          echo "MACOS_SIGNED=1" >> "$GITHUB_ENV"

      - name: macOS — notarisation (si secret présent)
        if: runner.os == 'macOS' && env.MACOS_SIGNED == '1'
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          ZIP="$RUNNER_TEMP/notarise.zip"
          ditto -c -k --keepParent "$BIN" "$ZIP"
          if [ -n "${MACOS_NOTARY_KEY_P8:-}" ]; then
            echo "$MACOS_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool submit "$ZIP" --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
            rm -f "$RUNNER_TEMP/notary.p8"
          else
            xcrun notarytool submit "$ZIP" --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          fi
          xcrun stapler staple "$BIN" || xcrun stapler staple "$ZIP"
          rm -f "$ZIP"

      # ── Assemblage : binaire nu + archive prête à l'emploi ────────────
      #
      # Deux formes pour deux usages : le binaire seul pour les scripts et les
      # utilisateurs avancés, l'archive pour celui qui veut double-cliquer.
      - name: Assemblage
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          STAGE="$RUNNER_TEMP/pkg"
          mkdir -p dist "$STAGE"
          cp "$BIN" "dist/${{ matrix.binary }}"
          cp "$BIN" "$STAGE/${{ matrix.bin }}"
          cp rust/scripts/lisez-moi-dist.txt "$STAGE/LISEZ-MOI.txt"
          cp LICENSE "$STAGE/LICENSE"
          cp "rust/scripts/lanceurs/${{ matrix.launcher }}" "$STAGE/${{ matrix.launcher }}"
          chmod +x "dist/${{ matrix.binary }}" "$STAGE/${{ matrix.bin }}" || true
          ls -l dist "$STAGE"

      # Chargeur WebView2 : l'import est dynamique avec MinGW, statique avec
      # MSVC. On ne joint la DLL que si le binaire la réclame réellement — inutile
      # d'alourdir l'archive et de laisser croire à une dépendance obligatoire.
      - name: Chargeur WebView2 (Windows, si requis)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if (-not $ascii.Contains('WebView2Loader.dll')) {
            Write-Host "Import statique : la DLL n'est pas nécessaire, rien n'est joint."
            exit 0
          }
          $loader = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src" -Recurse -Filter 'WebView2Loader.dll' -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match '\\x64$' } | Select-Object -First 1
          if (-not $loader) { throw "Le binaire importe WebView2Loader.dll mais la DLL est introuvable." }
          Copy-Item $loader.FullName 'dist/WebView2Loader.dll' -Force
          Copy-Item $loader.FullName (Join-Path $env:RUNNER_TEMP 'pkg/WebView2Loader.dll') -Force
          Write-Host "WebView2Loader.dll joint (depuis $($loader.FullName))"

      - name: Archive (Linux, macOS)
        if: matrix.compress == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pkg"
          zip -q -r "$GITHUB_WORKSPACE/dist/CUTTHEFLOW-${{ matrix.package }}.zip" .
          cd "$GITHUB_WORKSPACE/dist"
          unzip -l "CUTTHEFLOW-${{ matrix.package }}.zip"

      - name: Archive (Windows)
        if: matrix.compress == 'powershell'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'pkg'
          Compress-Archive -Path (Join-Path $stage '*') `
            -DestinationPath "dist/CUTTHEFLOW-${{ matrix.package }}.zip" -Force
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ctf-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publication des fichiers téléchargeables
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/cuttheflow-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - name: Sommes SHA-256
        run: |
          cd artefacts
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Version et étiquette
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./astro/package.json').version")
          ENGINE=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # Release glissante : l'étiquette porte le numéro de version, donc le
            # badge du README affiche « v2.5.0 » et non « latest ».
            TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=CUT THE FLOW ${VERSION} — moteur ${ENGINE}" >> "$GITHUB_ENV"
          echo "Étiquette : ${TAG}"

      - name: Notes de version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./astro/package.json').version")
          ENGINE=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          BASE="https://github.com/zigmoon/cuttheflow/releases/latest/download"
          {
            echo "Studio **${VERSION}** · moteur **${ENGINE}**"
            echo
            echo "L'interface est embarquée dans chaque exécutable : rien à installer à côté."
            echo "Sous Windows et macOS, le studio s'ouvre dans **sa propre fenêtre** (WebView2 / WKWebView),"
            echo "sans barre d'adresse ni onglets. **ffmpeg est optionnel** — sans lui, le studio travaille"
            echo "dans la vue embarquée (WebCodecs) : import, montage, aperçu et export MP4 / WebM / MP3."
            echo
            echo "| Système | Archive (avec lanceur) | Binaire seul |"
            echo "|---|---|---|"
            echo "| Windows 10/11 x64 — fenêtre native | [CUTTHEFLOW-windows-x86_64.zip](${BASE}/CUTTHEFLOW-windows-x86_64.zip) | [cuttheflow-windows-x86_64.exe](${BASE}/cuttheflow-windows-x86_64.exe) |"
            echo "| macOS Apple Silicon — fenêtre native | [CUTTHEFLOW-macos-arm64.zip](${BASE}/CUTTHEFLOW-macos-arm64.zip) | [cuttheflow-macos-arm64](${BASE}/cuttheflow-macos-arm64) |"
            echo "| macOS Intel — fenêtre native | [CUTTHEFLOW-macos-x86_64.zip](${BASE}/CUTTHEFLOW-macos-x86_64.zip) | [cuttheflow-macos-x86_64](${BASE}/cuttheflow-macos-x86_64) |"
            echo "| Linux x86-64 — fenêtre native (WebKitGTK) | [CUTTHEFLOW-linux-x86_64-desktop.zip](${BASE}/CUTTHEFLOW-linux-x86_64-desktop.zip) | [cuttheflow-linux-x86_64-desktop](${BASE}/cuttheflow-linux-x86_64-desktop) |"
            echo "| Linux x86-64 — autonome (aucune bibliothèque) | [CUTTHEFLOW-linux-x86_64.zip](${BASE}/CUTTHEFLOW-linux-x86_64.zip) | [cuttheflow-linux-x86_64](${BASE}/cuttheflow-linux-x86_64) |"
            echo "| Linux ARM64 — autonome | [CUTTHEFLOW-linux-aarch64.zip](${BASE}/CUTTHEFLOW-linux-aarch64.zip) | [cuttheflow-linux-aarch64](${BASE}/cuttheflow-linux-aarch64) |"
            echo
            echo "**Démarrer** — Windows : \`DEMARRER.cmd\` · Linux : \`bash demarrer.sh\` · macOS : \`demarrer.command\`"
            echo
            echo "Sous Linux, la build « autonome » ne dépend d'aucune bibliothèque : elle ouvre le studio"
            echo "dans le navigateur par défaut (\`--web\`). La build « fenêtre native » exige WebKitGTK 4.1"
            echo "(Ubuntu 24.04+, Debian 13+ : \`sudo apt install libwebkit2gtk-4.1-0\`)."
            echo
            echo "Le studio web reste disponible : https://app.zigmoon.com/CUTTHEFLOW/"
            echo
            echo "Intégrité : voir \`SHA256SUMS.txt\` dans les fichiers ci-dessous."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
          echo "RELEASE_NOTES=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Release (version glissante ou taguée)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: artefacts/*
          make_latest: true
          fail_on_unmatched_files: true

      # Un fichier publié lors d'une construction précédente et qui n'existe
      # plus aujourd'hui resterait sinon en ligne pour toujours (cas de la DLL
      # WebView2, devenue inutile avec MSVC).
      - name: Ménage des fichiers obsolètes
        if: env.RELEASE_TAG != 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd artefacts
          ls -1 > "$RUNNER_TEMP/attendu.txt"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/publie.txt"
          while IFS= read -r fichier; do
            [ -z "$fichier" ] && continue
            if ! grep -qxF "$fichier" "$RUNNER_TEMP/attendu.txt"; then
              echo "suppression de l'ancien fichier : $fichier"
              gh release delete-asset "$RELEASE_TAG" "$fichier" --yes || true
            fi
          done < "$RUNNER_TEMP/publie.txt"

      # Une fois la nouvelle release publiée, on retire l'ancienne étiquette
      # glissante « latest » des débuts : elle doublonnait dans la liste.
      # Best-effort : son échec ne remet pas en cause la publication.
      - name: Ménage de l'ancienne étiquette glissante
        if: env.RELEASE_TAG != 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --cleanup-tag --yes || true
