# Construction de CUT THE FLOW sur les trois systèmes, et PUBLICATION des
# fichiers téléchargeables.
#
# Ce fichier vit à la racine du dépôt (`.github/workflows/build.yml`) : GitHub
# n'exécute que les workflows présents à cet endroit. Les chemins supposent que
# `astro/` et `rust/` sont à la racine.
#
# ── Pourquoi une version « glissante » ────────────────────────────────
# Chaque poussée sur `main` reconstruit les cinq binaires et met à jour une
# release dont le tag est `latest`. Les liens de téléchargement du README sont
# donc stables et toujours valables :
#
#   https://github.com/zigmoon/cuttheflow/releases/latest/download/<fichier>
#
# Un tag `cuttheflow-v*` crée en plus une release versionnée, marquée comme
# « latest » elle aussi : les mêmes liens continuent de fonctionner.
#
# ── Signature macOS : deux niveaux, jamais bloquants ──────────────────
#   1. TOUJOURS : signature ad-hoc (`codesign -s -`). Indispensable : sur Apple
#      Silicon, un binaire non signé est tué par le noyau.
#   2. SI les secrets sont fournis : signature Developer ID (durcie) +
#      notarisation Apple + agrafage. Secrets attendus :
#        MACOS_CERT_P12          certificat .p12 encodé en base64
#        MACOS_CERT_PASSWORD     mot de passe du .p12
#        MACOS_SIGN_IDENTITY     ex. « Developer ID Application: NOM (TEAMID) »
#        MACOS_NOTARY_APPLE_ID   identifiant Apple
#        MACOS_NOTARY_PASSWORD   mot de passe d'application (app-specific)
#        MACOS_NOTARY_TEAM_ID    identifiant d'équipe
#      (variante clé API : MACOS_NOTARY_KEY_ID / MACOS_NOTARY_ISSUER_ID /
#       MACOS_NOTARY_KEY_P8, contenu du .p8 en base64.)
#      Sans ces secrets le workflow réussit : les binaires sont ad-hoc signés,
#      donc exécutables, simplement non notariés.

name: CUT THE FLOW

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'cuttheflow-v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Deux poussées rapprochées ne doivent pas se disputer la même release.
concurrency:
  group: cuttheflow-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests du moteur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace --manifest-path rust/Cargo.toml

  build:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x86-64
            binary: cuttheflow-windows-x86_64.exe
            bin: cuttheflow.exe
            package: windows-x86_64
            launcher: DEMARRER.cmd
            compress: powershell
            # Fenêtre native : l'interface s'ouvre dans une vraie fenêtre
            # d'application (WebView2, présent sur Windows 10/11).
            features: '--features desktop'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: Linux x86-64 (autonome)
            binary: cuttheflow-linux-x86_64
            bin: cuttheflow
            package: linux-x86_64
            launcher: demarrer.sh
            compress: zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: Linux x86-64 (fenêtre native)
            binary: cuttheflow-linux-x86_64-desktop
            bin: cuttheflow
            package: linux-x86_64-desktop
            launcher: demarrer.sh
            compress: zip
            # La fenêtre native exige WebKitGTK (donc glibc, pas musl).
            features: '--features desktop'
            webkit: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: Linux ARM64
            binary: cuttheflow-linux-aarch64
            bin: cuttheflow
            package: linux-aarch64
            launcher: demarrer.sh
            compress: zip
            cross: aarch64-linux-gnu-gcc
          - os: macos-15
            target: aarch64-apple-darwin
            name: macOS Apple Silicon
            binary: cuttheflow-macos-arm64
            bin: cuttheflow
            package: macos-arm64
            launcher: demarrer.command
            compress: zip
            # WKWebView fait partie de macOS : la fenêtre native ne demande
            # aucune bibliothèque supplémentaire.
            features: '--features desktop'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macOS Intel
            binary: cuttheflow-macos-x86_64
            bin: cuttheflow
            package: macos-x86_64
            launcher: demarrer.command
            compress: zip
            features: '--features desktop'

    runs-on: ${{ matrix.os }}
    env:
      # Les secrets sont exposés au niveau du job : un `if` d'étape ne peut pas
      # lire un `env` défini sur cette même étape.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Interface Astro
        run: |
          npm ci --prefix astro
          npm run build --prefix astro

      - name: Dépendances Linux (musl x86-64)
        if: runner.os == 'Linux' && matrix.cross == '' && !matrix.webkit
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Dépendances Linux (musl ARM64)
        if: runner.os == 'Linux' && matrix.cross != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      # WebKitGTK est la seule dépendance de compilation de la fenêtre native
      # sous Linux. Elle est fournie par la distribution à l'exécution.
      - name: Dépendances Linux (WebKitGTK, fenêtre native)
        if: matrix.webkit
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Moteur Rust (natif)
        if: matrix.cross == ''
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} -p ctf-app ${{ matrix.features }}

      - name: Moteur Rust (ARM64 croisé)
        if: matrix.cross != ''
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.cross }}
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} -p ctf-app ${{ matrix.features }}

      - name: Tests unitaires du noyau
        if: matrix.cross == '' && runner.os != 'Linux'
        run: cargo test --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} -p ctf-core

      # ── Test de fumée du binaire livré ────────────────────────────────
      # Vérifie ce que l'utilisateur fera vraiment : la version, l'aide, et le
      # démarrage du studio. On utilise `--web --no-open` pour ne dépendre d'aucun
      # affichage (les runners n'ont pas d'écran, et WebKitGTK peut manquer).
      # Ce test aurait attrapé `cuttheflow --web` qui répondait « commande
      # inconnue » alors que le README le documente.
      - name: Fumée — le binaire livré démarre et répond
        if: matrix.cross == ''
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$BIN"

          echo "── --version"
          VERSION=$("$BIN" --version)
          echo "$VERSION"
          [[ "$VERSION" == cuttheflow* ]] || { echo "::error::--version ne répond pas"; exit 1; }

          echo "── --help"
          HELP=$("$BIN" --help)
          echo "$HELP" | head -20
          for attendu in "--web" "--native" "--port"; do
            echo "$HELP" | grep -q -- "$attendu" || { echo "::error::--help ne mentionne pas $attendu"; exit 1; }
          done
          if echo "$HELP" | grep -qi "le navigateur s'ouvre"; then
            echo "::error::--help décrit encore l'ancien comportement (navigateur au lieu de la fenêtre)"; exit 1
          fi

          echo "── doctor"
          "$BIN" doctor || echo "(ffmpeg absent sur ce runner : normal, le studio bascule en mode navigateur)"

          echo "── démarrage en mode navigateur"
          "$BIN" --web --no-open --port 7411 &
          PID=$!
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:7411/api/health -o "$RUNNER_TEMP/health.json"; then break; fi
            sleep 0.5
          done
          kill $PID 2>/dev/null || true
          cat "$RUNNER_TEMP/health.json" || { echo "::error::le serveur n'a pas répondu"; exit 1; }
          grep -q '"app":"cuttheflow"' "$RUNNER_TEMP/health.json" || { echo "::error::réponse /api/health inattendue"; exit 1; }

          echo "── interface servie"
          "$BIN" --web --no-open --port 7412 &
          PID=$!
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:7412/ -o "$RUNNER_TEMP/index.html"; then break; fi
            sleep 0.5
          done
          kill $PID 2>/dev/null || true
          grep -qi "CUT THE FLOW" "$RUNNER_TEMP/index.html" || { echo "::error::l'interface embarquée n'est pas servie"; exit 1; }
          grep -q 'service-worker' "$RUNNER_TEMP/index.html" || echo "(service worker non référencé dans index.html)"
          echo "fumée : OK"

      # ── macOS : signature ──────────────────────────────────────────────
      - name: macOS — signature ad-hoc (toujours)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$BIN"
          codesign --force --sign - --timestamp=none "$BIN"
          codesign --verify --verbose=2 "$BIN"

      - name: macOS — signature Developer ID (si secret présent)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          KEYCHAIN="$RUNNER_TEMP/ctf-signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          codesign --force --options runtime --timestamp \
            --entitlements rust/scripts/macos-entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          echo "MACOS_SIGNED=1" >> "$GITHUB_ENV"

      - name: macOS — notarisation (si secret présent)
        if: runner.os == 'macOS' && env.MACOS_SIGNED == '1'
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          ZIP="$RUNNER_TEMP/notarise.zip"
          ditto -c -k --keepParent "$BIN" "$ZIP"
          if [ -n "${MACOS_NOTARY_KEY_P8:-}" ]; then
            echo "$MACOS_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool submit "$ZIP" --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
            rm -f "$RUNNER_TEMP/notary.p8"
          else
            xcrun notarytool submit "$ZIP" --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          fi
          xcrun stapler staple "$BIN" || xcrun stapler staple "$ZIP"
          rm -f "$ZIP"

      # ── Assemblage : binaire nu + archive prête à l'emploi ────────────
      #
      # Deux formes pour deux usages : le binaire seul pour les scripts et les
      # utilisateurs avancés, l'archive pour celui qui veut double-cliquer.
      - name: Assemblage
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          STAGE="$RUNNER_TEMP/pkg"
          mkdir -p dist "$STAGE"
          cp "$BIN" "dist/${{ matrix.binary }}"
          cp "$BIN" "$STAGE/${{ matrix.bin }}"
          cp rust/scripts/lisez-moi-dist.txt "$STAGE/LISEZ-MOI.txt"
          cp LICENSE "$STAGE/LICENSE"
          cp "rust/scripts/lanceurs/${{ matrix.launcher }}" "$STAGE/${{ matrix.launcher }}"
          chmod +x "dist/${{ matrix.binary }}" "$STAGE/${{ matrix.bin }}" || true

          # Linux : entrée de menu + icônes. Sans elles, l'application n'apparaît
          # pas dans le lanceur et le tableau de bord invente une icône.
          case "${{ matrix.package }}" in
            linux-*)
              cp rust/scripts/lanceurs/cuttheflow.desktop "$STAGE/"
              cp rust/scripts/lanceurs/installer.sh "$STAGE/"
              chmod +x "$STAGE/installer.sh"
              mkdir -p "$STAGE/icons"
              cp rust/scripts/icons/cuttheflow-*.png "$STAGE/icons/"
              ;;
          esac
          ls -l dist "$STAGE"

      # Chargeur WebView2 : l'import est dynamique avec MinGW, statique avec
      # MSVC. On ne joint la DLL que si le binaire la réclame réellement — inutile
      # d'alourdir l'archive et de laisser croire à une dépendance obligatoire.
      - name: Chargeur WebView2 (Windows, si requis)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if (-not $ascii.Contains('WebView2Loader.dll')) {
            Write-Host "Import statique : la DLL n'est pas nécessaire, rien n'est joint."
            exit 0
          }
          $loader = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src" -Recurse -Filter 'WebView2Loader.dll' -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match '\\x64$' } | Select-Object -First 1
          if (-not $loader) { throw "Le binaire importe WebView2Loader.dll mais la DLL est introuvable." }
          Copy-Item $loader.FullName 'dist/WebView2Loader.dll' -Force
          Copy-Item $loader.FullName (Join-Path $env:RUNNER_TEMP 'pkg/WebView2Loader.dll') -Force
          Write-Host "WebView2Loader.dll joint (depuis $($loader.FullName))"

      # ── macOS : application et image disque ───────────────────────────
      #
      # Un .dmg n'est pas un simple conteneur : on y met un vrai bundle .app.
      # L'utilisateur double-clique l'image, glisse l'application dans
      # Applications, et macOS la traite comme une application (icône, Cmd+Tab,
      # pas de Terminal). Un binaire nu n'offrirait rien de tout cela.
      - name: macOS — application .app et image disque .dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          STUDIO=$(node -p "require('./astro/package.json').version")
          ENGINE=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          APP="$RUNNER_TEMP/dmg/CUT THE FLOW.app"

          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/cuttheflow"
          chmod +x "$APP/Contents/MacOS/cuttheflow"
          cp rust/scripts/lisez-moi-dist.txt "$RUNNER_TEMP/dmg/LISEZ-MOI.txt"
          cp LICENSE "$RUNNER_TEMP/dmg/LICENSE"

          # Icône : le PNG du studio, décliné en .icns par les outils d'Apple.
          SRC=astro/public/img/icon-512.png
          if [ -f "$SRC" ]; then
            ICONSET="$RUNNER_TEMP/AppIcon.iconset"
            mkdir -p "$ICONSET"
            for s in 16 32 128 256 512; do
              sips -z $s $s "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
              d=$((s * 2))
              sips -z $d $d "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
            done
            iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          else
            echo "(pas d'icône source, l'application utilisera l'icône générique)"
          fi

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>CUT THE FLOW</string>
            <key>CFBundleDisplayName</key><string>CUT THE FLOW</string>
            <key>CFBundleExecutable</key><string>cuttheflow</string>
            <key>CFBundleIdentifier</key><string>com.zigmoon.cuttheflow</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${STUDIO}</string>
            <key>CFBundleVersion</key><string>${ENGINE}</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.video</string>
          </dict>
          </plist>
          PLIST

          # Signature ad-hoc du bundle : obligatoire sur Apple Silicon, et rend
          # l'application cohérente pour Gatekeeper.
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP" || true

          # Raccourci vers Applications, comme toute image disque macOS.
          ln -sfn /Applications "$RUNNER_TEMP/dmg/Applications"

          hdiutil create \
            -volname "CUT THE FLOW" \
            -srcfolder "$RUNNER_TEMP/dmg" \
            -ov -format UDZO \
            "dist/CUTTHEFLOW-${{ matrix.package }}.dmg"
          ls -l "dist/CUTTHEFLOW-${{ matrix.package }}.dmg"

      # ── Windows : installateur ────────────────────────────────────────
      #
      # Un .exe à double-cliquer, avec raccourci dans le menu Démarrer et
      # désinstallation propre. Le binaire nu reste publié pour ceux qui
      # préfèrent une version portable.
      - name: Windows — installateur .exe (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Inno Setup n'est pas préinstallé : on l'installe, et si cela échoue
          # on continue sans installateur plutôt que de casser la publication.
          try {
            choco install innosetup --no-progress -y | Out-Null
          } catch {
            Write-Host "::warning::Inno Setup indisponible, l'installateur ne sera pas produit."
            exit 0
          }
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $found = Get-ChildItem "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not $iscc) {
            Write-Host "::warning::ISCC.exe introuvable, l'installateur ne sera pas produit."
            exit 0
          }
          Write-Host "ISCC : $iscc"

          # Icône .ico : ICO accepte un PNG 256x256 depuis Vista. On rééchantillonne
          # le PNG du studio pour éviter un format d'icône inattendu.
          Add-Type -AssemblyName System.Drawing
          $src = 'astro/public/img/icon-512.png'
          $ico = Join-Path $env:RUNNER_TEMP 'cuttheflow.ico'
          $image = [System.Drawing.Image]::FromFile((Resolve-Path $src))
          $bitmap = New-Object System.Drawing.Bitmap 256, 256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $graphics.DrawImage($image, 0, 0, 256, 256)
          $graphics.Dispose()
          $memory = New-Object System.IO.MemoryStream
          $bitmap.Save($memory, [System.Drawing.Imaging.ImageFormat]::Png)
          $png = $memory.ToArray()
          $memory.Dispose(); $bitmap.Dispose(); $image.Dispose()

          $stream = [System.IO.File]::Create($ico)
          $writer = New-Object System.IO.BinaryWriter($stream)
          $writer.Write([UInt16]0); $writer.Write([UInt16]1); $writer.Write([UInt16]1)
          $writer.Write([Byte]0); $writer.Write([Byte]0)
          $writer.Write([Byte]0); $writer.Write([Byte]0)
          $writer.Write([UInt16]1); $writer.Write([UInt16]32)
          $writer.Write([UInt32]$png.Length); $writer.Write([UInt32]22)
          $writer.Write($png)
          $writer.Close()

          $studio = (Get-Content astro/package.json -Raw | ConvertFrom-Json).version
          $engine = (Select-String -Path rust/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $exe = Resolve-Path "rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          $sourceDir = Split-Path $exe -Parent

          # Sans la DLL compagnes, l'application installée meurt sans un mot
          # (0xC0000135). L'installateur embarque donc tout ce qui se trouve à
          # côté de l'exécutable ; le script .iss les joint s'ils existent.
          & $iscc `
            "/DStudioVersion=$studio" `
            "/DEngineVersion=$engine" `
            "/DSourceExe=$exe" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$(Resolve-Path dist)" `
            "/DIconFile=$ico" `
            "/DReadmeFile=$(Resolve-Path 'rust/scripts/lisez-moi-dist.txt')" `
            "/DLicenseFile=$(Resolve-Path LICENSE)" `
            'rust/scripts/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué (code $LASTEXITCODE)" }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Archive (Linux, macOS)
        if: matrix.compress == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pkg"
          zip -q -r "$GITHUB_WORKSPACE/dist/CUTTHEFLOW-${{ matrix.package }}.zip" .
          cd "$GITHUB_WORKSPACE/dist"
          unzip -l "CUTTHEFLOW-${{ matrix.package }}.zip"

      - name: Archive (Windows)
        if: matrix.compress == 'powershell'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'pkg'
          Compress-Archive -Path (Join-Path $stage '*') `
            -DestinationPath "dist/CUTTHEFLOW-${{ matrix.package }}.zip" -Force
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ctf-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publication des fichiers téléchargeables
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/cuttheflow-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - name: Sommes SHA-256
        run: |
          cd artefacts
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Version et étiquette
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./astro/package.json').version")
          ENGINE=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # Release glissante : l'étiquette porte le numéro de version, donc le
            # badge du README affiche « v2.5.0 » et non « latest ».
            TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=CUT THE FLOW ${VERSION} — moteur ${ENGINE}" >> "$GITHUB_ENV"
          echo "Étiquette : ${TAG}"

      - name: Notes de version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./astro/package.json').version")
          ENGINE=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          BASE="https://github.com/zigmoon/cuttheflow/releases/latest/download"
          {
            echo "Studio **${VERSION}** · moteur **${ENGINE}**"
            echo
            echo "L'interface est embarquée dans chaque exécutable : rien à installer à côté."
            echo "**ffmpeg est optionnel** — sans lui, le studio encode dans la vue embarquée"
            echo "(WebCodecs) : import, montage, aperçu et export MP4 / WebM / MP3."
            echo
            echo "| Système | Ce que vous téléchargez |"
            echo "|---|---|"
            echo "| Windows 10/11 x64 | [**Installateur .exe**](${BASE}/CUTTHEFLOW-windows-x86_64-setup.exe) — raccourci dans le menu Démarrer, désinstallation propre |"
            echo "| Windows 10/11 x64 | [Archive portable .zip](${BASE}/CUTTHEFLOW-windows-x86_64.zip) — rien n'est installé |"
            echo "| macOS Apple Silicon | [**Image disque .dmg**](${BASE}/CUTTHEFLOW-macos-arm64.dmg) — contient \`CUT THE FLOW.app\` |"
            echo "| macOS Intel | [**Image disque .dmg**](${BASE}/CUTTHEFLOW-macos-x86_64.dmg) |"
            echo "| Linux x86-64 | [Archive .zip — fenêtre native](${BASE}/CUTTHEFLOW-linux-x86_64-desktop.zip) (WebKitGTK) |"
            echo "| Linux x86-64 | [Archive .zip — autonome](${BASE}/CUTTHEFLOW-linux-x86_64.zip) (aucune bibliothèque) |"
            echo "| Linux ARM64 | [Archive .zip — autonome](${BASE}/CUTTHEFLOW-linux-aarch64.zip) |"
            echo
            echo "**Démarrer** — Windows : double-cliquez l'installateur, puis lancez CUT THE FLOW"
            echo "depuis le menu Démarrer. macOS : ouvrez le .dmg, glissez l'application dans"
            echo "Applications. Linux : extrayez l'archive, puis \`bash demarrer.sh\`."
            echo
            echo "Sous Linux, la build « autonome » ne dépend d'aucune bibliothèque : elle ouvre"
            echo "le studio dans le navigateur par défaut (\`--web\`). La build « fenêtre native »"
            echo "exige WebKitGTK 4.1 (Ubuntu 24.04+, Debian 13+)."
            echo
            echo "macOS : l'application est signée ad-hoc mais non notariée. Au premier"
            echo "lancement, clic droit → **Ouvrir**."
            echo
            echo "Le studio web reste disponible : https://app.zigmoon.com/CUTTHEFLOW/"
            echo
            echo "Intégrité : voir \`SHA256SUMS.txt\` dans les fichiers ci-dessous."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
          echo "RELEASE_NOTES=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Release (version glissante ou taguée)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: artefacts/*
          make_latest: true
          fail_on_unmatched_files: true

      # Un fichier publié lors d'une construction précédente et qui n'existe
      # plus aujourd'hui resterait sinon en ligne pour toujours (cas de la DLL
      # WebView2, devenue inutile avec MSVC).
      - name: Ménage des fichiers obsolètes
        if: env.RELEASE_TAG != 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd artefacts
          ls -1 > "$RUNNER_TEMP/attendu.txt"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/publie.txt"
          while IFS= read -r fichier; do
            [ -z "$fichier" ] && continue
            if ! grep -qxF "$fichier" "$RUNNER_TEMP/attendu.txt"; then
              echo "suppression de l'ancien fichier : $fichier"
              gh release delete-asset "$RELEASE_TAG" "$fichier" --yes || true
            fi
          done < "$RUNNER_TEMP/publie.txt"

      # Une fois la nouvelle release publiée, on retire l'ancienne étiquette
      # glissante « latest » des débuts : elle doublonnait dans la liste.
      # Best-effort : son échec ne remet pas en cause la publication.
      - name: Ménage de l'ancienne étiquette glissante
        if: env.RELEASE_TAG != 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --cleanup-tag --yes || true
