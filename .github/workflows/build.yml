# Construction des binaires CUT THE FLOW sur les trois systèmes.
#
# CE FICHIER VIT À LA RACINE DU DÉPÔT (`.github/workflows/build.yml`) : GitHub
# n'exécute que les workflows présents à cet endroit. Les chemins ci-dessous
# supposent que `astro/` et `rust/` sont à la racine du dépôt.
#
# macOS ne peut être produit que sur un hôte macOS (SDK Apple). C'est tout
# l'intérêt de ce workflow.
#
# Signature macOS — deux niveaux, jamais bloquants :
#   1. TOUJOURS : signature ad-hoc (`codesign -s -`). Indispensable : sur Apple
#      Silicon, un binaire non signé est tué par le noyau, même téléchargé
#      depuis un dépôt interne.
#   2. SI les secrets sont fournis : signature Developer ID (durcie) +
#      notarisation Apple + agrafage. Secrets attendus :
#        MACOS_CERT_P12          certificat .p12 encodé en base64
#        MACOS_CERT_PASSWORD     mot de passe du .p12
#        MACOS_SIGN_IDENTITY     ex. « Developer ID Application: NOM (TEAMID) »
#        MACOS_NOTARY_APPLE_ID   identifiant Apple
#        MACOS_NOTARY_PASSWORD   mot de passe d'application (app-specific)
#        MACOS_NOTARY_TEAM_ID    identifiant d'équipe
#      (variante API key acceptée : MACOS_NOTARY_KEY_ID / MACOS_NOTARY_ISSUER_ID
#       / MACOS_NOTARY_KEY_P8, contenu du .p8 en base64.)
#      Sans ces secrets le workflow réussit quand même : les binaires sont
#      ad-hoc signés, donc exécutables, simplement non notariés.

name: CUT THE FLOW 2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/build.yml'
    tags:
      - 'cuttheflow-v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests du moteur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace --manifest-path rust/Cargo.toml

  build:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x86-64
            artifact_name: cuttheflow-windows-x86_64.exe
            bin: cuttheflow.exe
            artifact: cuttheflow-windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: Linux x86-64
            artifact_name: cuttheflow-linux-x86_64
            bin: cuttheflow
            artifact: cuttheflow-linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            name: macOS Apple Silicon
            artifact_name: cuttheflow-macos-arm64
            bin: cuttheflow
            artifact: cuttheflow-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macOS Intel
            artifact_name: cuttheflow-macos-x86_64
            bin: cuttheflow
            artifact: cuttheflow-macos-x86_64

    runs-on: ${{ matrix.os }}
    env:
      # Les secrets sont exposés au niveau du job : `if` ne peut pas lire un
      # `env` défini sur l'étape elle-même.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Interface Astro
        run: |
          npm ci --prefix astro
          npm run build --prefix astro

      - name: Dépendances Linux (musl)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Moteur Rust
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} -p ctf-app

      - name: Tests unitaires du noyau
        if: runner.os != 'Linux'
        run: cargo test --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} -p ctf-core

      # ── macOS : signature ──────────────────────────────────────────────
      - name: macOS — signature ad-hoc (toujours)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$BIN"
          codesign --force --sign - --timestamp=none "$BIN"
          codesign --verify --verbose=2 "$BIN"

      - name: macOS — signature Developer ID (si secret présent)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          KEYCHAIN="$RUNNER_TEMP/ctf-signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          codesign --force --options runtime --timestamp \
            --entitlements rust/scripts/macos-entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          echo "MACOS_SIGNED=1" >> "$GITHUB_ENV"

      - name: macOS — notarisation (si secret présent)
        if: runner.os == 'macOS' && env.MACOS_SIGNED == '1'
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          NAME="${{ matrix.artifact_name }}"
          ZIP="$RUNNER_TEMP/$NAME.zip"
          ditto -c -k --keepParent "$BIN" "$ZIP"

          if [ -n "${MACOS_NOTARY_KEY_P8:-}" ]; then
            echo "$MACOS_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool submit "$ZIP" --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
            rm -f "$RUNNER_TEMP/notary.p8"
          else
            xcrun notarytool submit "$ZIP" --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          fi
          xcrun stapler staple "$BIN" || xcrun stapler staple "$ZIP"
          rm -f "$ZIP"

      # ── Assemblage ─────────────────────────────────────────────────────
      - name: Assemblage
        shell: bash
        run: |
          mkdir -p out
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.bin }}" \
             "out/${{ matrix.artifact_name }}"
          cp rust/scripts/lisez-moi-dist.txt out/LISEZ-MOI.txt
          cp LICENSE out/LICENSE
          cd out
          shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          cat "${{ matrix.artifact_name }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publication des binaires
    needs: build
    if: startsWith(github.ref, 'refs/tags/cuttheflow-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true
      - name: Sommes SHA-256 globales
        run: |
          cd artefacts
          ls -l
          shasum -a 256 cuttheflow-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artefacts/*
          generate_release_notes: true
